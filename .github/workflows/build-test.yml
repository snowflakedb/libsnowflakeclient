name: Build and Test

on:
    push:
        branches:
            - master
        tags:
            - v*
    pull_request:
        branches:
            - '**'
    schedule:
        - cron: '0 0 * * 0'

concurrency:
    # older builds for the same pull request numer or branch should be cancelled
    cancel-in-progress: true
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
    build-test-mock:
        name: Build-Test-Mock
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            build_type: [ 'Debug', 'Release' ]
        steps:
          - uses: actions/checkout@v5
          - name: Restore cached deps
            id: cache-restore-deps
            uses: actions/cache/restore@v5
            with:
              path: dep-cache
              key: ${{ matrix.build_type }}-${{ github.event.pull_request.base.sha }}-Linux-dep-cache
            if: github.event_name == 'pull_request'
          - name: Build
            shell: bash
            env:
              BUILD_TYPE: ${{ matrix.build_type }}
              ENABLE_MOCK_OBJECTS: 'true'
            run: ci/build_linux.sh
          - uses: actions/setup-python@v6
            with:
              python-version: '>=3.13.5' # temporary bound until it becomes the default, https://github.com/python/cpython/issues/135151
              architecture: 'x64'
          - name: Test
            shell: bash
            env:
              BUILD_TYPE: ${{ matrix.build_type }}
              CLOUD_PROVIDER: 'AWS'
              PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            run: ci/test_linux.sh

    build-test-linux:
        name: Build-Test-Linux
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                build_type: [ 'Debug', 'Release' ]
                cloud_provider: [ 'AWS', 'AZURE', 'GCP' ]
        steps:
            - uses: actions/checkout@v5
            - name: Restore cached deps
              id: cache-restore-deps
              uses: actions/cache/restore@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ github.event.pull_request.base.sha }}-Linux-dep-cache
              if: github.event_name == 'pull_request'
            - name: Build
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
              run: ci/build_linux.sh
            - name: Cache deps
              id: cache-save-deps
              uses: actions/cache/save@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ github.sha }}-Linux-dep-cache
              if: github.ref_name == github.event.repository.default_branch && matrix.cloud_provider == 'AWS'
            - uses: actions/setup-python@v6
              with:
                python-version: '>=3.13.5' # temporary bound until it becomes the default, https://github.com/python/cpython/issues/135151
                architecture: 'x64'
            - name: Test
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLOUD_PROVIDER: ${{ matrix.cloud_provider }}
                  PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
              run: ci/test_linux.sh

    build-test-win-vs2022:
        name: Build-Test-Win-vs2022
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                platform: [ 'x64', 'x86' ]
                build_type: [ 'Debug', 'Release' ]
                vs_version: [ 'VS16', 'VS17' ]
                cloud_provider: [ 'AWS', 'AZURE', 'GCP' ]
        steps:
            - uses: actions/checkout@v5
            - name: Install CMake
              shell: cmd
              run: |
                curl -L "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip" -o cmake.zip
                tar -xf cmake.zip
                echo %cd%\cmake-3.31.6-windows-x86_64\bin>> %GITHUB_PATH%
                cmake --version
            - name: Enable long paths
              # Enable long-path support so the recursive aws-sdk-cpp clone, which
              # has deeply nested submodule paths, can be checked out and built on
              # Windows without hitting the 260-char path limit.
              shell: cmd
              run: |
                git config --system core.longpaths true
                reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
            - name: Install v142 Spectre-mitigated libraries
              if: matrix.vs_version == 'VS16'
              shell: cmd
              run: >
                "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
                modify
                --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
                --add Microsoft.VisualStudio.Component.VC.v142.x86.x64
                --add Microsoft.VisualStudio.Component.VC.v142.x86.x64.Spectre
                --quiet
                --wait
                --norestart
            - name: Verify v142 Spectre-mitigated libraries
              if: matrix.vs_version == 'VS16'
              shell: pwsh
              run: |
                $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                if (-not (Test-Path $vswhere)) {
                  throw "vswhere.exe was not found at $vswhere"
                }

                $installPath = & $vswhere `
                  -latest `
                  -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath

                if (-not $installPath -or -not (Test-Path $installPath)) {
                  throw "Unable to locate a Visual Studio installation containing the MSVC tools."
                }

                $toolsetRoot = Join-Path $installPath "VC\Tools\MSVC"
                $v142Toolset = Get-ChildItem $toolsetRoot -Directory |
                  Where-Object { $_.Name -match '^14\.2\d+\.' } |
                  Sort-Object Name -Descending |
                  Select-Object -First 1

                if (-not $v142Toolset) {
                  Get-ChildItem $toolsetRoot -Directory -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty FullName
                  throw "No v142 MSVC toolset was found under $toolsetRoot"
                }

                $libraryPath = Join-Path $v142Toolset.FullName "lib\${{ matrix.platform }}\spectre"

                Write-Host "Visual Studio installation: $installPath"
                Write-Host "v142 toolset: $($v142Toolset.FullName)"
                Write-Host "Checking Spectre library path: $libraryPath"

                if (-not (Test-Path $libraryPath -PathType Container)) {
                  Get-ChildItem $v142Toolset.FullName -Recurse -Directory -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -match 'spectre' } |
                    Select-Object -ExpandProperty FullName
                  throw "v142 Spectre libraries are missing for platform ${{ matrix.platform }}: $libraryPath"
                }

                Write-Host "v142 Spectre libraries verified successfully."
            - name: Restore cached deps
              id: cache-restore-deps
              uses: actions/cache/restore@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ matrix.platform }}-${{ matrix.vs_version }}-${{ github.event.pull_request.base.sha }}-Win-dep-cache
              if: github.event_name == 'pull_request'
            - name: Build
              shell: cmd
              env:
                  PLATFORM: ${{ matrix.platform }}
                  BUILD_TYPE: ${{ matrix.build_type }}
                  VS_VERSION: ${{ matrix.vs_version }}
              run: ci\build_win.bat
            - name: Cache deps
              id: cache-save-deps
              uses: actions/cache/save@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ matrix.platform }}-${{ matrix.vs_version }}-${{ github.sha }}-Win-dep-cache
              if: github.ref_name == github.event.repository.default_branch && matrix.cloud_provider == 'AWS'
            - uses: actions/setup-python@v6
              with:
                python-version: '>=3.13.5' # temporary bound until it becomes the default, https://github.com/python/cpython/issues/135151
                architecture: 'x64'
            - name: Test
              shell: cmd
              env:
                  PLATFORM: ${{ matrix.platform }}
                  BUILD_TYPE: ${{ matrix.build_type }}
                  VS_VERSION: ${{ matrix.vs_version }}
                  CLOUD_PROVIDER: ${{ matrix.cloud_provider }}
                  PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
              run: ci\test_win.bat
    build-test-mac:
        name: Build-Test-Mac
        runs-on: macos-14
        strategy:
            fail-fast: false
            matrix:
                build_type: [ 'Debug', 'Release' ]
                cloud_provider: [ 'AWS', 'AZURE', 'GCP' ]
        steps:
            - uses: actions/checkout@v5
            - name: Install Homebrew Bash
              shell: bash
              run: brew install bash
            - name: Install CMake
              shell: bash
              run: |
                curl -L "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz" -o cmake.tar.gz
                tar -xzf cmake.tar.gz
                echo "$PWD/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH
                cmake --version
            - name: Restore cached deps
              id: cache-restore-deps
              uses: actions/cache/restore@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ github.event.pull_request.base.sha }}-Mac-dep-cache
              if: github.event_name == 'pull_request'
            - name: Build
              shell: bash
              env:
                BUILD_TYPE: ${{ matrix.build_type }}
              run: ./ci/build_mac.sh
            - name: Cache deps
              id: cache-save-deps
              uses: actions/cache/save@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ github.sha }}-Mac-dep-cache
              if: github.ref_name == github.event.repository.default_branch && matrix.cloud_provider == 'AWS'
            - name: Test
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLOUD_PROVIDER: ${{ matrix.cloud_provider }}
                  PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
              run: ci/test_mac.sh
    build-test-codecov-aws:
        name: Build-Test-CodeCov-Linux-AWS
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                build_type: [ 'Release' ]
        steps:
            - uses: actions/checkout@v5
            - name: Restore cached deps
              id: cache-restore-deps
              uses: actions/cache/restore@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ github.event.pull_request.base.sha }}-Linux-dep-cache
              if: github.event_name == 'pull_request'
            - name: Build
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLIENT_CODE_COVERAGE: 1
              run: ci/build_linux.sh
            - uses: actions/setup-python@v6
              with:
                python-version: '>=3.13.5' # temporary bound until it becomes the default, https://github.com/python/cpython/issues/135151
                architecture: 'x64'
            - name: Test on AWS
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLIENT_CODE_COVERAGE: 1
                  CLOUD_PROVIDER: AWS
                  PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
              run: ci/test_linux.sh
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v6
              with:
                # without the token code cov may fail because of Github limits https://github.com/codecov/codecov-action/issues/557
                token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
                fail_ci_if_error: false
    build-test-codecov-azure:
        name: Build-Test-CodeCov-Linux-AZURE
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                build_type: [ 'Release' ]
        steps:
            - uses: actions/checkout@v5
            - name: Restore cached deps
              id: cache-restore-deps
              uses: actions/cache/restore@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ github.event.pull_request.base.sha }}-Linux-dep-cache
              if: github.event_name == 'pull_request'
            - name: Build
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLIENT_CODE_COVERAGE: 1
              run: ci/build_linux.sh
            - uses: actions/setup-python@v6
              with:
                python-version: '>=3.13.5' # temporary bound until it becomes the default, https://github.com/python/cpython/issues/135151
                architecture: 'x64'
            - name: Test on AZURE
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLIENT_CODE_COVERAGE: 1
                  CLOUD_PROVIDER: AZURE
                  PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
              run: ci/test_linux.sh
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v6
              with:
                # without the token code cov may fail because of Github limits https://github.com/codecov/codecov-action/issues/557
                token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
                fail_ci_if_error: false
    build-test-codecov-gcp:
        name: Build-Test-CodeCov-Linux-GCP
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                build_type: [ 'Release' ]
        steps:
            - uses: actions/checkout@v5
            - name: Restore cached deps
              id: cache-restore-deps
              uses: actions/cache/restore@v5
              with:
                path: dep-cache
                key: ${{ matrix.build_type }}-${{ github.event.pull_request.base.sha }}-Linux-dep-cache
              if: github.event_name == 'pull_request'
            - name: Build
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLIENT_CODE_COVERAGE: 1
              run: ci/build_linux.sh
            - uses: actions/setup-python@v6
              with:
                python-version: '>=3.13.5' # temporary bound until it becomes the default, https://github.com/python/cpython/issues/135151
                architecture: 'x64'
            - name: Test on GCP
              shell: bash
              env:
                  BUILD_TYPE: ${{ matrix.build_type }}
                  CLIENT_CODE_COVERAGE: 1
                  CLOUD_PROVIDER: GCP
                  PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
              run: ci/test_linux.sh
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v6
              with:
                # without the token code cov may fail because of Github limits https://github.com/codecov/codecov-action/issues/557
                token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
                fail_ci_if_error: false
